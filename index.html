<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Welcome | loafc</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: #0B0D17;
            color: #F5F5F7;
            display: flex;
            font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
            justify-content: center;
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 36rem;
            width: 100%;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            line-height: 1.15;
            margin: 0 0 16px;
        }

        #nm {
            color: #64D2FF;
            white-space: nowrap;
        }

        #nm::after {
            animation: caret-blink 1.1s steps(2) infinite;
            background: #64D2FF;
            content: "";
            display: inline-block;
            height: 1em;
            margin-left: 2px;
            vertical-align: -0.1em;
            width: 0.5ch;
        }

        @keyframes caret-blink {
            to {
                visibility: hidden;
            }
        }

        p {
            color: #A1A1A6;
            font-size: 1rem;
            line-height: 1.6;
            margin: 12px 0;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 24px;
        }

        .button {
            align-items: center;
            background: rgba(32, 33, 40, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #F5F5F7;
            display: inline-flex;
            justify-content: center;
            min-height: 44px;
            padding: 10px 16px;
            text-decoration: none;
        }

        .button:hover,
        .button:focus-visible {
            background: #0A84FF;
            border-color: #0A84FF;
            color: #FFFFFF;
        }

        .button:focus-visible {
            outline: 2px solid #64D2FF;
            outline-offset: 3px;
        }

        .button.primary {
            background: #0A84FF;
            border-color: #0A84FF;
            color: #FFFFFF;
            font-weight: 700;
        }

        .button.primary:hover,
        .button.primary:focus-visible {
            background: #409CFF;
            border-color: #409CFF;
        }

        footer {
            color: #A1A1A6;
            font-size: 0.8rem;
            margin-top: 48px;
        }

        @media (prefers-reduced-motion: reduce) {
            #nm::after {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome!</h1>
        <p>Heya, I'm <span id="nm" aria-label="Horia, aka loaf">Horia</span>.</p>
        <p>This is the main domain for my website.</p>
        <nav class="links" aria-label="My links">
            <a class="button primary" href="https://forgejo.loafc.online" target="_blank" rel="noopener noreferrer">Forgejo</a>
            <a class="button" href="mailto:loafcccc@gmail.com">Email</a>
            <a class="button" href="https://github.com/loafcc" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a class="button" href="https://www.instagram.com/loaf.photographs" target="_blank" rel="noopener noreferrer">Instagram</a>
        </nav>
        <footer>© 2026 loafc. All rights reserved.</footer>
    </main>
    <script>
        const name = document.querySelector("#nm");
        const names = ["Horia", "loaf"];

        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
            let wordIndex = 0;
            let characterIndex = names[0].length;
            let deleting = true;

            const typeName = () => {
                const currentName = names[wordIndex];

                if (!deleting) {
                    characterIndex += 1;
                    name.textContent = currentName.slice(0, characterIndex);
                    if (characterIndex === currentName.length) {
                        deleting = true;
                        return setTimeout(typeName, 1800);
                    }
                    return setTimeout(typeName, 140);
                }

                characterIndex -= 1;
                name.textContent = currentName.slice(0, characterIndex);
                if (characterIndex === 0) {
                    deleting = false;
                    wordIndex = (wordIndex + 1) % names.length;
                    return setTimeout(typeName, 400);
                }
                setTimeout(typeName, 80);
            };

            setTimeout(typeName, 1800);
        }
    </script>
</body>
</html>
